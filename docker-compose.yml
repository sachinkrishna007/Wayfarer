version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: wayfarer_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: wayfarer
    volumes:
      - mongodb_data:/data/db
    networks:
      - wayfarer_network

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wayfarer_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://root:password@mongodb:27017/wayfarer
      # Add other environment variables from your .env file
      # DATABASE_URL: mongodb://root:password@mongodb:27017/wayfarer
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    networks:
      - wayfarer_network
    command: npm run server

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wayfarer_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend/src:/app/src
    networks:
      - wayfarer_network

volumes:
  mongodb_data:

networks:
  wayfarer_network:
    driver: bridge
